plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jianxi.jansee'
    compileSdk 34

    defaultConfig {
        applicationId "com.jianxi.jansee"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
    }

    signingConfigs {
        release {
            storeFile file('../jansee-release.keystore')
            storePassword System.getenv('KS_PASS') ?: 'jansee2026'
            keyAlias 'jansee'
            keyPassword System.getenv('KEY_PASS') ?: 'jansee2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.browser:browser:1.5.0'
}