<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f8fa" />
  <title>简兮 JANSEE · 暂时离线</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f8fa;color:#252936;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
    main{width:min(100%,440px);padding:34px;border:1px solid #e7e9f0;border-radius:18px;background:#fff;box-shadow:0 20px 60px rgba(35,45,90,.07)}
    .mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#8795ff,#586bdc);display:grid;place-items:center;color:white;font-weight:700;font-size:20px}
    h1{font-size:23px;line-height:1.45;margin:27px 0 10px}
    p{font-size:13px;line-height:1.9;color:#858c9b;margin:0 0 24px}
    button{border:0;border-radius:8px;background:#6979e7;color:#fff;padding:11px 17px;font-size:12px;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">J</div>
    <h1>网络暂时离开了一会儿。</h1>
    <p>简兮当前处于离线状态。重新连接网络后，你可以继续使用导演工作台。为保护你的素材与账号信息，离线模式不会读取或保存私人作品数据。</p>
    <button type="button" onclick="location.reload()">重新连接</button>
  </main>
</body>
</html>
