<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="400" y="90" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="42" fill="#151a22">行至简处，见光影，见山海，见简兮。</text>
  <text x="400" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#151a22" letter-spacing="6">JANSEE</text>
</svg>
