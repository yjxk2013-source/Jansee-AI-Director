<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=430, height=932, initial-scale=1.0, user-scalable=no">
<title>简兮 JANSEE · 商业五件套沉浸交付 (画面 3)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body {
    width: 430px; height: 932px; overflow: hidden;
    background-color: #050505; color: #e4e4e7;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    position: relative; user-select: none;
  }

  .bg-glow {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(45% 35% at 50% 25%, rgba(255, 255, 255, 0.05) 0%, transparent 80%),
      radial-gradient(50% 40% at 50% 100%, rgba(20, 20, 30, 0.4) 0%, transparent 80%);
  }

  /* 状态栏 */
  .status-bar {
    height: 48px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; font-weight: 600; color: #ffffff; position: relative; z-index: 10;
  }
  .dynamic-island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 32px; background: #000000; border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .status-icons { display: flex; align-items: center; gap: 6px; }

  /* 顶栏 */
  .top-bar {
    height: 50px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between;
    position: relative; z-index: 10;
  }
  .brand-group { display: flex; align-items: baseline; gap: 8px; }
  .brand-title { font-size: 19px; font-weight: 600; color: #ffffff; letter-spacing: 0.04em; }
  .ready-pill {
    font-size: 11px; color: #ffffff; padding: 2px 8px;
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 2px; letter-spacing: 0.04em;
  }

  /* 赛马版本切换条 */
  .race-version-bar {
    padding: 6px 20px 10px; display: flex; gap: 8px; overflow-x: auto; position: relative; z-index: 10;
  }
  .ver-pill {
    padding: 6px 12px; font-size: 12px; color: #a1a1aa; background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 2px; white-space: nowrap;
  }
  .ver-pill.active {
    background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.45);
    color: #ffffff; font-weight: 500;
  }

  /* 滚动内容区 */
  .delivery-scroll {
    height: calc(932px - 48px - 50px - 44px - 84px); overflow-y: auto;
    padding: 6px 20px 14px; display: flex; flex-direction: column; gap: 14px;
    position: relative; z-index: 10;
  }

  /* 9:16 沉浸成片播放窗口 */
  .player-box {
    width: 100%; aspect-ratio: 9 / 11; border-radius: 2px;
    border: 1px solid rgba(255, 255, 255, 0.2); position: relative; overflow: hidden;
    background: #000000; box-shadow: 0 0 24px rgba(0, 0, 0, 0.8);
  }
  .player-bg { width: 100%; height: 100%; object-fit: cover; }
  .play-trigger {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.3); display: flex; align-items: center; justify-content: center;
  }
  .play-trigger svg { width: 16px; height: 16px; fill: #ffffff; margin-left: 2px; }
  .player-hud-top {
    position: absolute; top: 10px; left: 10px; right: 10px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .hud-badge {
    padding: 2px 6px; background: rgba(0, 0, 0, 0.65); border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 2px; font-size: 10px; color: #ffffff; letter-spacing: 0.04em;
  }
  .player-subtitles {
    position: absolute; bottom: 20px; left: 14px; right: 14px; text-align: center;
  }
  .sub-zh {
    display: inline-block; padding: 4px 10px; background: rgba(0, 0, 0, 0.7);
    color: #ffffff; font-size: 13px; font-weight: 500; letter-spacing: 0.04em;
    border-radius: 2px; border: 1px solid rgba(255, 255, 255, 0.1);
  }

  /* 商业出片五件套卡片 */
  .bundle-card {
    background: rgba(18, 18, 22, 0.6); backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 2px; padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .bundle-header { display: flex; justify-content: space-between; align-items: center; }
  .bundle-title { font-size: 13px; font-weight: 500; color: #ffffff; }
  .bundle-tag { font-size: 11px; color: #a1a1aa; }

  .copy-box {
    background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 2px; padding: 10px; font-size: 12px; color: #d4d4d8; line-height: 1.5;
  }
  .tags-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .tag-item {
    font-size: 10px; color: #ffffff; background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 2px; padding: 2px 6px;
  }

  /* 底部双核心操作栏 */
  .bottom-dock {
    position: absolute; bottom: 0; left: 0; right: 0; height: 84px;
    padding: 12px 20px 24px; background: linear-gradient(to top, #050505 85%, transparent);
    display: flex; gap: 10px; align-items: center; z-index: 20;
  }
  .btn-copy {
    flex: 1; height: 46px; display: flex; align-items: center; justify-content: center; gap: 6px;
    background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 2px; color: #e4e4e7; font-size: 13px; font-weight: 500;
  }
  .btn-save {
    flex: 1.4; height: 46px; display: flex; align-items: center; justify-content: center; gap: 6px;
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 2px; color: #ffffff; font-size: 14px; font-weight: 500;
    box-shadow: 0 0 16px rgba(255, 255, 255, 0.12);
  }
  .btn-save svg, .btn-copy svg { width: 14px; height: 14px; fill: currentColor; }

  .home-indicator {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 4px; background: rgba(255, 255, 255, 0.3); border-radius: 2px;
  }
</style>
</head>
<body>
<div class="bg-glow"></div>

<div class="status-bar">
  <span>09:41</span>
  <div class="dynamic-island"></div>
  <div class="status-icons">
    <svg width="15" height="11" viewBox="0 0 15 11" fill="none"><path d="M1 8.5C3.5 5 11.5 5 14 8.5M3 10C5 8 10 8 12 10" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/></svg>
    <svg width="22" height="11" viewBox="0 0 22 11" fill="none"><rect x="0.5" y="0.5" width="19" height="10" rx="2.5" stroke="#fff"/><rect x="2" y="2" width="14" height="7" rx="1.5" fill="#fff"/><path d="M21 4V7" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/></svg>
  </div>
</div>

<div class="top-bar">
  <div class="brand-group">
    <div class="brand-title">简兮 JANSEE</div>
    <div class="ready-pill">1080P 成片就绪</div>
  </div>
</div>

<!-- 赛马版本切换条 -->
<div class="race-version-bar">
  <div class="ver-pill active">版本 1 · 痛点反转</div>
  <div class="ver-pill">版本 2 · 细节特写</div>
  <div class="ver-pill">版本 3 · 限时促单</div>
</div>

<div class="delivery-scroll">
  <!-- 播放窗口 -->
  <div class="player-box">
    <svg class="player-bg" viewBox="0 0 360 440" preserveAspectRatio="none">
      <defs><linearGradient id="pbg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2d2824"/><stop offset="100%" stop-color="#0f0e0d"/></linearGradient></defs>
      <rect width="360" height="440" fill="url(#pbg)"/>
      <path d="M110 140 L180 70 L250 140 L230 360 L130 360 Z" fill="#52443a" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    </svg>
    <div class="player-hud-top">
      <div class="hud-badge">1080×1920 竖版带货</div>
      <div class="hud-badge">AIGC 国标隐式注入</div>
    </div>
    <div class="play-trigger">
      <svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21"/></svg>
    </div>
    <div class="player-subtitles">
      <div class="sub-zh">这件双面羊绒大衣，版型真的绝了，垂顺挺括</div>
    </div>
  </div>

  <!-- 商业五件套 -->
  <div class="bundle-card">
    <div class="bundle-header">
      <div class="bundle-title">商业出片五件套</div>
      <div class="bundle-tag">已同步生成</div>
    </div>
    <div class="copy-box">
      【秋冬高级感天花板】实穿不挑身材的羊绒大衣来了！纯手工双面缝制，上身秒显挺拔气场，现货仅此一批，手慢无！
      <div class="tags-row">
        <span class="tag-item">#大衣穿搭</span>
        <span class="tag-item">#羊绒大衣</span>
        <span class="tag-item">#显瘦气质</span>
        <span class="tag-item">#源头工厂</span>
      </div>
    </div>
  </div>
</div>

<!-- 吸底操作栏 -->
<div class="bottom-dock">
  <button class="btn-copy">
    <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    <span>复制文案</span>
  </button>
  <button class="btn-save">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="7 10 12 15 17 10" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2"/></svg>
    <span>保存视频到相册</span>
  </button>
</div>

<div class="home-indicator"></div>
</body>
</html>
