# ═══════════════════════════════════════════════════════════════
# 简兮 (JANSEE) · Nginx 全局安全加固配置规范
# 生产部署位置：/etc/nginx/conf.d/security-hardening.conf
# 作用：裸 IP 阻断、敏感路径 444 静默断连、隐藏版本号
# ═══════════════════════════════════════════════════════════════

# ── 1. 裸 IP 直连 / 未知 Host 全部 444 断连（HTTPS 层）──
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/jansee.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jansee.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}

# ── 2. 裸 IP 直连 / 未知 Host 全部 444 断连（HTTP 层）──
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    # 百度站长平台验证文件放行
    location = /baidu_verify_codeva-wMUJpgz2w6.html {
        default_type text/html;
        return 200 'bcaf5ca70ddc4a7de626e1f20d0a416b';
    }

    return 444;
}
