# ═══════════════════════════════════════════════════════════════
# 简兮 (JANSEE) · Fail2ban 自动防御配置规范
# 生产部署位置：/etc/fail2ban/jail.d/jansee-security.conf
# 作用：10分钟内探测敏感路径5次自动拉黑24小时；后台爆破5次封禁1小时
# ═══════════════════════════════════════════════════════════════

[nginx-sensitive-scan]
enabled  = true
port     = http,https
filter   = nginx-sensitive-scan
logpath  = /var/log/nginx/access.log
maxretry = 5
findtime = 600
bantime  = 86400
action   = iptables-multiport[name=nginx-scan, port="http,https", protocol=tcp]

[nginx-http-auth]
enabled  = true
port     = http,https
filter   = nginx-http-auth
logpath  = /var/log/nginx/error.log
maxretry = 5
findtime = 300
bantime  = 3600
