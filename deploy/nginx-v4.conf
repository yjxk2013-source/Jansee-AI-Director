server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 500m;

    # Production compression: drastically reduces transfer bandwidth and speeds up page load
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location = /robots.txt {
        default_type text/plain;
        if ($host = admin.jansee.cn) {
            return 200 "User-agent: *\nDisallow: /\n";
        }
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location = /health/web {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        proxy_pass http://api:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The host-level TLS reverse proxy is the only process allowed to reach
        # 127.0.0.1:8080. Preserve its normalized client identity and HTTPS scheme.
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    location /health/ {
        proxy_pass http://api:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Preserve the V2 indexed brand identity URL and consolidate it to the V4 canonical page.
    location = /brand-identity.html {
        return 301 /about-jansee.html;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Service Worker 必须每次检查更新，绝不能被 immutable 缓存。
    # 否则浏览器 7 天内不会重新拉取 sw.js，部署新版本后仍用旧 SW 缓存的旧页面
    # （表现为"代码已上线但前端没变化"）。精确匹配 (=) 优先级高于下方 .js 正则规则。
    location = /sw.js {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|webp|ico)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
}
